<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- SEO & canonical -->
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://www.knost.in/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="alternate" hreflang="en" href="https://www.knost.in/" />

    <!-- Resource hints for Google Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Basics -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Knost — smart expense tracking, budgeting, and analytics to help you master your money."
    />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark" />
    <title>Knost — Know Your Cost</title>

    <!-- Icons -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Knost — Know Your Cost" />
    <meta
      property="og:description"
      content="Take control of your expenses, budgets, and savings with powerful insights and smart financial tools."
    />
    <meta property="og:image" content="https://www.knost.in/social-preview.png" />
    <meta property="og:url" content="https://www.knost.in/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Knost — Know Your Cost" />
    <meta
      name="twitter:description"
      content="Take control of your expenses, budgets, and savings with powerful insights and smart financial tools."
    />
    <meta name="twitter:image" content="https://www.knost.in/social-preview.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Knost",
        "description": "Smart expense tracking, budgeting and analytics to help you master your money.",
        "url": "https://www.knost.in/",
        "applicationCategory": "FinanceApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload critical hero (optional; remove if not above the fold) -->
    <!-- <link rel="preload" as="image" href="/welcome-illustration.png" /> -->

    <!-- Loading styles and accessible utilities -->
    <style>
      html,
      body,
      #root {
        background: #0a0c10;
        color: #f2f6fb;
        min-height: 100%;
      }
      #preload-spinner {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0c10;
        z-index: 60;
      }
      #preload-spinner .dot {
        height: 44px;
        width: 44px;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00a86b;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <a href="#root" class="sr-only">Skip to main content</a>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="preload-spinner" role="status" aria-label="Loading application...">
      <div class="dot" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
